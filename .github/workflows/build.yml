name: R4 candidate checks (never publishes)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
  container:
    # Standard hosted runners are free for this public repository. Never use paid larger runners.
    if: github.event.repository.private == false
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Record capacity
        run: df -h
      - name: Build local candidate; no registry credentials or push
        run: docker build -t pp-r4-candidate .
      - name: Exercise actual candidate without GPU or model downloads
        run: bash tests/container-smoke.sh pp-r4-candidate
      - name: Record immutable local image ID
        run: docker image inspect pp-r4-candidate > image-inspect.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-container-evidence
          retention-days: 7
          path: |
            image-inspect.json
            container-evidence/
